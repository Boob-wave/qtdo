<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ê ông ơi! ❤️</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
      background: radial-gradient(circle at top, #54275e, #19162f 58%, #0c1020);
      overflow-x: hidden;
    }
    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
    }
    .panel {
      width: min(900px, 100%);
      text-align: center;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      margin: 0 0 12px;
      font-weight: 800;
    }
    p {
      font-size: clamp(1rem, 2.8vw, 1.2rem);
      line-height: 1.6;
    }
    .muted { color: #d9cce8; }
    .small { font-size: .9rem; }
    .btn-funny, .upload-label {
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      color: #28152f;
      background: #ffcae2;
      box-shadow: 0 8px 25px #0004;
      transition: .18s;
      display: inline-block;
      text-decoration: none;
    }
    .btn-funny:hover, .upload-label:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
      color: #28152f;
    }
    .btn-funny:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }
    .primary {
      background: linear-gradient(135deg, #ffb5d2, #ffdc91);
    }
    .options {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin: 25px 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin: 25px auto;
      max-width: 760px;
    }
    .grid img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 18px;
      opacity: 0;
      transform: translateY(18px);
      animation: show .8s forwards;
      box-shadow: 0 8px 24px #0005;
    }
    @keyframes show {
      to { opacity: 1; transform: translateY(0); }
    }
    .question {
      font-size: clamp(1.6rem, 5vw, 2.7rem);
      font-weight: 900;
      margin: 20px 0;
    }
    .choice {
      display: block;
      width: min(430px, 100%);
      margin: 12px auto;
      border-radius: 18px;
    }
    .note {
      min-height: 30px;
      color: #ffe5a8;
      font-weight: 800;
    }
    .final-photo {
      width: min(330px, 80vw);
      max-height: 340px;
      object-fit: cover;
      border-radius: 24px;
      margin: 18px auto;
      display: block;
      box-shadow: 0 10px 30px #0006;
    }
    input[type=file] { display: none; }
    .heart {
      position: fixed;
      pointer-events: none;
      animation: float 3s linear forwards;
      font-size: 22px;
      z-index: 9999;
    }
    @keyframes float {
      to { transform: translateY(-110vh) rotate(30deg); opacity: 0; }
    }
    .owner-box {
      margin: 25px auto 18px;
      padding: 16px;
      border: 1px solid #ffffff35;
      border-radius: 18px;
      max-width: 540px;
      background: #ffffff0b;
    }
    .owner-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .status {
      min-height: 24px;
      color: #ffe5a8;
      margin-top: 8px;
    }
  </style>
</head>
<body>
<div class="wrap">
  <main class="panel">
    <div id="content">
      <h1>Ê ông ơi! 💖</h1>
      <p class="muted">Chào mừng đến với góc ảnh của tôi.</p>
      <div id="gallery" class="grid"></div>
      <p id="galleryStatus" class="small muted">Đang tải ảnh...</p>

      <div class="owner-box">
        <strong>📸 Chọn ảnh kỷ niệm (Chế độ Web Tĩnh)</strong>
        <p class="small muted mb-2">Bạn có thể chọn ảnh từ máy để xem thử ngay, hoặc dùng danh sách mặc định trong code.</p>
        <div class="owner-row">
          <label class="upload-label primary" for="photos">📁 Chọn ảnh từ máy</label>
          <input id="photos" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple>
          <button class="btn-funny" id="clearPhotos" hidden>🗑️ Xóa ảnh chọn tạm</button>
        </div>
        <div id="ownerStatus" class="status small"></div>
      </div>

      <button class="btn-funny primary" id="start" disabled>Bắt đầu ✨</button>
    </div>
  </main>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script>
  const content = document.getElementById('content');
  const gallery = document.getElementById('gallery');
  const galleryStatus = document.getElementById('galleryStatus');
  const startBtn = document.getElementById('start');
  const clearBtn = document.getElementById('clearPhotos');
  const ownerStatus = document.getElementById('ownerStatus');

  // Danh sách ảnh mặc định từ thư mục images của bạn
  const DEFAULT_PHOTOS = [
    "images/DSC_0107.jpeg",
    "images/DSC_0113.jpeg",
    "images/DSC_0313.jpeg",
    "images/F162C6D0-818F-433E-BA9C-4F3C4D961E74.png",
    "images/IMG_0476.JPG",
    "images/IMG_0608.jpg",
    "images/IMG_0614.jpg",
    "images/IMG_0669.jpg",
    "images/IMG_0670.jpg",
    "images/IMG_1015.jpg",
    "images/IMG_1094.JPG",
    "images/IMG_6441.jpg"
  ];

  let photoUrls = [...DEFAULT_PHOTOS];

  const wishes = [
    "Chúc ông luôn vui vẻ, khỏe mạnh, tiền vào như nước và lúc nào cũng gặp may mắn! 🍀",
    "Chúc ông tuổi mới bùng nổ, làm gì cũng thuận lợi, cười thật nhiều và luôn có anh em bên cạnh! 🎉",
    "Chúc ông ngày càng đẹp trai, giàu có, hạnh phúc — nhớ giữ lời hứa chiếc iPhone nhé! 📱"
  ];

  function renderGallery() {
    gallery.innerHTML = '';
    photoUrls.forEach((url, i) => {
      const im = new Image();
      im.src = url;
      im.alt = 'Ảnh kỷ niệm';
      im.style.animationDelay = (i * 0.18) + 's';
      im.onerror = () => { im.style.display = 'none'; };
      gallery.appendChild(im);
    });

    if (photoUrls.length > 0) {
      galleryStatus.textContent = `Có ${photoUrls.length} tấm ảnh đang chờ ông khám phá ❤️`;
      startBtn.disabled = false;
    } else {
      galleryStatus.textContent = 'Chưa có ảnh nào. Hãy nhấn "Chọn ảnh từ máy" bên dưới để thêm ảnh chơi ngay nhé!';
      startBtn.disabled = true;
    }
  }

  // Xử lý khi người dùng chọn ảnh trực tiếp từ máy
  document.getElementById('photos').addEventListener('change', (e) => {
    const files = [...e.target.files];
    if (!files.length) return;

    const tempUrls = files.map(file => URL.createObjectURL(file));
    photoUrls = [...photoUrls, ...tempUrls];
    clearBtn.hidden = false;
    ownerStatus.textContent = `Đã thêm ${files.length} ảnh thành công!`;
    renderGallery();
    e.target.value = '';
  });

  clearBtn.onclick = () => {
    photoUrls = [...DEFAULT_PHOTOS];
    clearBtn.hidden = true;
    ownerStatus.textContent = 'Đã xóa ảnh chọn tạm.';
    renderGallery();
  };

  startBtn.onclick = () => {
    content.innerHTML = '<h1>Những khoảnh khắc của tôi 📸</h1><p class="muted">Ảnh đang xuất hiện từ từ...</p><div class="grid" id="show"></div><p class="muted">Chạm vào màn hình để tiếp tục nhé 👆</p>';
    const g = document.getElementById('show');
    photoUrls.forEach((url, i) => {
      const im = new Image();
      im.src = url;
      im.style.animationDelay = (i * 0.28) + 's';
      g.appendChild(im);
    });
    content.onclick = () => {
      content.onclick = null;
      q1();
    };
  };

  function dodge(btn) {
    btn.addEventListener('pointerenter', () => move(btn));
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      move(btn);
    });
  }

  function move(btn) {
    btn.style.position = 'fixed';
    btn.style.left = Math.random() * Math.max(20, innerWidth - 140) + 'px';
    btn.style.top = Math.random() * Math.max(20, innerHeight - 80) + 'px';
    btn.style.zIndex = 10;
  }

  function q1() {
    content.innerHTML = '<div class="question">Câu 1: Tôi có đẹp trai không? 😎</div><div class="options"><button class="btn-funny primary" id="yes">Có ❤️</button><button class="btn-funny" id="no">Không 🙅</button></div>';
    dodge(document.getElementById('no'));
    document.getElementById('yes').onclick = () => {
      sound();
      content.innerHTML = '<h1>Tôi cũng biết tôi đẹp trai mà! 😎</h1><p style="font-size:4rem">🗿</p><p>*Âm thanh meme bruhhh* 💀</p><button class="btn-funny primary" id="next">Tiếp tục ➜</button>';
      document.getElementById('next').onclick = q2;
    };
  }

  function q2() {
    content.innerHTML = '<div class="question">Câu 2: Ông có đẹp trai không? 😏</div><div class="options"><button class="btn-funny primary" id="yes">Có 😎</button><button class="btn-funny" id="no">Không</button></div>';
    dodge(document.getElementById('no'));
    document.getElementById('yes').onclick = () => {
      content.innerHTML = '<h1>Tôi code sai đấy, ông chỉ đẹp trai sau tôi thôi! 🤣</h1><p style="font-size:4rem">👑</p><button class="btn-funny primary" id="next">Câu tiếp theo ➜</button>';
      document.getElementById('next').onclick = q3;
    };
  }

  function q3() {
    content.innerHTML = '<div class="question">Câu 3: Ông sẽ mua gì tặng tôi? 🎁</div><button class="btn-funny choice primary" id="phone">📱 iPhone 18 Pro Max</button><button class="btn-funny choice" id="money">💸 Chuyển 300 triệu</button><button class="btn-funny choice" id="car">🚗 Xe VF3</button><button class="btn-funny choice" id="poop">💩 Tặng cái cục cứt</button><div class="note" id="note"></div>';
    const note = document.getElementById('note');
    ['money', 'car'].forEach(id => {
      document.getElementById(id).onclick = () => {
        note.textContent = 'Ông có tiền đâu mà chọn 😂';
        document.getElementById(id).remove();
      };
    });
    dodge(document.getElementById('poop'));
    document.getElementById('phone').onclick = finale;
  }

  function finale() {
    sound();
    for (let i = 0; i < 24; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = ['❤️', '💖', '✨', '🎉'][i % 4];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.bottom = '-30px';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 3500);
    }
    const wish = wishes[Math.floor(Math.random() * wishes.length)];
    const img = photoUrls.length ? '<img class="final-photo" src="' + photoUrls[Math.floor(Math.random() * photoUrls.length)] + '">' : '';
    content.innerHTML = '<h1>YÊU CẦU ĐÃ ĐƯỢC GHI NHẬN! 📱</h1><p style="font-size:3.5rem">🎉🤣🥳</p>' + img + '<h2>' + wish + '</h2><p class="muted">Cảm ơn ông đã tham gia bài kiểm tra quan trọng này ❤️</p><button class="btn-funny primary" onclick="location.reload()">Chơi lại ↻</button>';
  }

  function sound() {
    try {
      const C = AudioContext || webkitAudioContext;
      const c = new C();
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(220, c.currentTime);
      o.frequency.exponentialRampToValueAtTime(75, c.currentTime + 0.42);
      g.gain.setValueAtTime(0.001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.15, c.currentTime + 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.55);
      o.connect(g);
      g.connect(c.destination);
      o.start();
      o.stop(c.currentTime + 0.56);
    } catch (e) {}
  }

  renderGallery();
</script>
</body>
</html>
